<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Lash Station | Ana Clara</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            /* --- PALETA DE LUXO (CLÍNICA) --- */
            --bg-body: #F9F9F7;           /* Off-white quente */
            --gold-primary: #C6A75E;      /* Dourado Matte */
            --gold-light: rgba(198,167,94,0.12);
            --gold-gradient: linear-gradient(135deg, #DBC17F 0%, #C6A75E 100%);
            --text-dark: #2C2C2C;         /* Preto não absoluto (mais elegante) */
            --text-gray: #888888;
            --white: #FFFFFF;
            --glass: rgba(255, 255, 255, 0.85);
            --shadow-soft: 0 10px 40px rgba(198,167,94,0.08);
            --danger: #E57373;
        }

        body {
            background-color: var(--bg-body);
            background-image: radial-gradient(at top center, #FFFFFF 0%, var(--bg-body) 80%);
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            padding-bottom: 100px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- CABEÇALHO --- */
        .header-section {
            padding: 40px 20px 20px;
            text-align: center;
        }
        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--gold-primary);
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .brand-subtitle {
            font-size: 0.65rem;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 600;
        }

        /* --- MENU FLUTUANTE (DOCK STYLE) --- */
        .nav-scroller {
            position: sticky;
            top: 20px; /* Flutua no topo ao rolar */
            z-index: 1000;
            display: flex;
            justify-content: center;
            padding: 0 15px;
            margin-bottom: 25px;
        }

        .nav-pills {
            background: var(--glass);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 100px; /* Formato de pílula gigante */
            padding: 6px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            
            /* Rolagem horizontal suave */
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 5px;
            max-width: 100%;
            scrollbar-width: none;
        }
        .nav-pills::-webkit-scrollbar { display: none; }

        .nav-link-custom {
            border: none;
            background: transparent;
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-gray);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px; /* Espaço ícone-texto */
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-link-custom i { font-size: 1rem; margin-bottom: 1px; }

        /* Estado Ativo (O Dourado) */
        .nav-link-custom.active {
            background: var(--gold-primary);
            color: var(--white);
            box-shadow: 0 5px 20px rgba(198,167,94,0.4);
            transform: scale(1.02);
        }
        .nav-link-custom:hover:not(.active) {
            color: var(--gold-primary);
            background: var(--gold-light);
        }

        /* --- CARDS (CONTAINERS) --- */
        .luxury-card {
            background: var(--white);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(0,0,0,0.02);
            box-shadow: var(--shadow-soft);
            animation: slideUp 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }
        /* Detalhe dourado sutil no topo do card */
        .luxury-card::before {
            content: ''; position: absolute; top:0; left:0; right:0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            opacity: 0.5;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card-header-title {
            font-family: 'Montserrat', sans-serif;
            color: var(--gold-primary);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            opacity: 0.9;
        }

        /* --- INPUTS & BOTÕES --- */
        .form-input {
            background: #FAFAFA;
            border: 1px solid #EAEAEA;
            border-radius: 14px;
            padding: 16px;
            font-size: 0.9rem;
            width: 100%;
            margin-bottom: 15px;
            transition: 0.3s;
            color: var(--text-dark);
        }
        .form-input:focus {
            outline: none; background: #FFF;
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 4px var(--gold-light);
        }

        .btn-action {
            background: var(--gold-primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(198,167,94,0.2);
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(198,167,94,0.3);
            background: #bd9e55;
        }

        /* --- CHAT --- */
        .chat-box {
            height: 400px;
            overflow-y: auto;
            background: #FAFAFA;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .bubble { padding: 12px 18px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; max-width: 85%; }
        .bubble-ai { background: white; border: 1px solid #EEE; color: var(--text-dark); align-self: flex-start; border-bottom-left-radius: 4px; }
        .bubble-user { background: var(--gold-primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 5px 15px rgba(198,167,94,0.3); }

        /* --- AGENDA GRID --- */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 15px; }
        .day-box {
            aspect-ratio: 1; border-radius: 12px;
            background: white; border: 1px solid transparent;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.85rem; color: var(--text-gray); cursor: pointer; transition: 0.2s;
        }
        .day-box:hover { border-color: var(--gold-primary); background: var(--bg-body); }
        .day-box.today { background: var(--gold-primary); color: white; font-weight: 700; box-shadow: 0 5px 15px rgba(198,167,94,0.4); }
        .event-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 3px; }
        .dot-russo { background: var(--gold-primary); }
        .dot-blocked { background: var(--danger); }
        /* Ajuste para o ponto aparecer branco no dia atual */
        .day-box.today .dot-russo { background: white; }

        /* --- UPLOAD BOX --- */
        .upload-area {
            border: 2px dashed #DDD;
            border-radius: 18px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer; transition: 0.3s;
            background: #FAFAFA;
        }
        .upload-area:hover { border-color: var(--gold-primary); color: var(--gold-primary); background: var(--gold-light); }

        /* --- EXTRAS --- */
        .fab-btn {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px;
            border-radius: 50%;
            background: white;
            color: var(--gold-primary);
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .fab-btn:hover { transform: scale(1.1) rotate(10deg); }

        /* Modais */
        .modal-glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(5px); }
        .modal-content-glass { border: none; border-radius: 24px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }

    </style>
</head>
<body>

    <div class="header-section">
        <div class="brand-title">Lash Station</div>
        <div class="brand-subtitle">Ana Clara • Beauty Artist</div>
    </div>

    <div class="nav-scroller">
        <div class="nav-pills" id="pills-tab" role="tablist">
            <button class="nav-link-custom active" data-bs-toggle="pill" data-bs-target="#pills-agenda">
                <i class="bi bi-calendar-check"></i> Agenda
            </button>
            <button class="nav-link-custom" data-bs-toggle="pill" data-bs-target="#pills-chat">
                <i class="bi bi-stars"></i> Mentora
            </button>
            <button class="nav-link-custom" data-bs-toggle="pill" data-bs-target="#pills-vision">
                <i class="bi bi-eye"></i> Visagismo
            </button>
            <button class="nav-link-custom" data-bs-toggle="pill" data-bs-target="#pills-boss">
                <i class="bi bi-graph-up"></i> Financeiro
            </button>
            <button class="nav-link-custom" data-bs-toggle="pill" data-bs-target="#pills-estoque">
                <i class="bi bi-box2-heart"></i> Estoque
            </button>
            <button class="nav-link-custom" data-bs-toggle="pill" data-bs-target="#pills-face">
                <i class="bi bi-palette"></i> FaceChart
            </button>
            <button class="nav-link-custom" data-bs-toggle="pill" data-bs-target="#pills-zap">
                <i class="bi bi-whatsapp"></i> Zap
            </button>
        </div>
    </div>

    <div class="container mt-2 tab-content" style="max-width: 600px;">

        <div class="tab-pane fade show active" id="pills-agenda">
            <div class="luxury-card">
                <div class="card-header-title">Agenda Mensal</div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button class="btn btn-sm" style="color:var(--text-gray)" onclick="mudarMes(-1)">❮ ANTERIOR</button>
                    <span id="mesAnoTitulo" style="font-weight:700; color:var(--text-dark)">--</span>
                    <button class="btn btn-sm" style="color:var(--text-gray)" onclick="mudarMes(1)">PRÓXIMO ❯</button>
                </div>
                <div class="d-flex justify-content-between px-2 text-muted" style="font-size:0.65rem; letter-spacing:1px; margin-bottom:10px;">
                    <span>DOM</span><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-chat">
            <div class="luxury-card">
                <div class="card-header-title"><i class="bi bi-magic me-2"></i> Sócia Virtual</div>
                <div id="chatBox" class="chat-box">
                    <div class="bubble bubble-ai">Olá, Ana! ✨ Tudo pronto para transformar olhares hoje?</div>
                </div>
                <div class="d-flex gap-2">
                    <input type="text" id="msgInput" class="form-input mb-0" placeholder="Digite sua dúvida..." onkeypress="if(event.key==='Enter') enviar()">
                    <button class="btn-action" style="width:auto; padding:0 25px;" onclick="enviar()"><i class="bi bi-send-fill"></i></button>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-vision">
            <div class="luxury-card text-center">
                <div class="card-header-title">Análise Facial</div>
                
                <label for="imageInput" class="w-100">
                    <div class="upload-area">
                        <i class="bi bi-camera" style="font-size: 2.5rem; color:var(--gold-primary); display:block; margin-bottom:10px;"></i>
                        <span style="font-weight:500; color:var(--text-gray);">Toque para tirar foto</span>
                    </div>
                </label>
                <input type="file" id="imageInput" hidden onchange="analisarFoto()">
                
                <div id="loadingVision" style="display:none; margin-top:30px; color:var(--gold-primary); font-weight:600;">
                    <div class="spinner-border spinner-border-sm" role="status"></div> Analisando...
                </div>
                <div id="resultAnalysis" class="mt-4 text-start" style="display:none; background:#F9F9F9; padding:25px; border-radius:18px; color:var(--text-dark); border:1px solid #EEE; line-height:1.7;"></div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-boss">
            <div class="luxury-card">
                <div class="card-header-title">Fluxo de Caixa</div>
                <div class="text-center py-4">
                    <div style="font-size: 0.7rem; color: var(--text-gray); letter-spacing: 2px;">FATURAMENTO MÊS</div>
                    <div id="faturamentoDisplay" style="font-size: 3rem; font-family: 'Playfair Display'; color: var(--gold-primary); font-weight: 500;">R$ 0,00</div>
                </div>
                <div class="progress mb-4" style="height: 6px; background: #EEE; border-radius: 10px;">
                    <div id="metaBar" class="progress-bar" style="background: var(--gold-primary); width: 0%; border-radius: 10px;"></div>
                </div>
                <div class="d-flex gap-2">
                    <input type="number" id="valorEntrada" class="form-input mb-0" placeholder="Valor (R$)">
                    <button class="btn-action" style="width:auto; padding:0 30px;" onclick="addMoney()">Add</button>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-estoque">
            <div class="luxury-card">
                <div class="card-header-title">Controle de Estoque</div>
                <div id="stockList"></div>
                <div class="d-flex gap-2 mt-4 pt-3 border-top">
                    <input type="text" id="newItemName" class="form-input mb-0" placeholder="Novo Item">
                    <button class="btn-action" style="width:auto; padding:0 20px;" onclick="addNewItem()">+</button>
                </div>
                <button class="btn-action mt-3" style="background: white; border: 1px solid var(--gold-primary); color: var(--gold-primary); box-shadow:none;" onclick="pedirReposicao()">📋 Gerar Pedido WhatsApp</button>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-face">
            <div class="luxury-card text-center">
                <div class="card-header-title">Face Chart Digital</div>
                <canvas id="faceCanvas" width="300" height="300" style="background: white; border: 1px solid #EEE; border-radius:12px; touch-action: none; cursor: crosshair;"></canvas>
                <div class="mt-3 d-flex justify-content-center gap-2">
                    <button class="btn-action" style="background: #F5F5F5; color: #555; width:auto; box-shadow:none;" onclick="limparCanvas()">Limpar</button>
                    <label class="btn-action" style="width:auto; margin:0;">
                        Fundo 📸 <input type="file" onchange="loadCanvasImage(event)" hidden>
                    </label>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="pills-zap">
            <div class="luxury-card">
                <div class="card-header-title">Scripts Rápidos</div>
                <input type="text" id="clientZapName" class="form-input" placeholder="Nome da Cliente">
                <input type="number" id="clientZapNumber" class="form-input" placeholder="WhatsApp (DDD+Num)">
                
                <div class="d-grid gap-3 mt-4">
                    <button class="btn-action" style="background: white; border: 1px solid #EEE; color: var(--text-gray); text-align: left; box-shadow: none; display:flex; align-items:center;" onclick="enviarScript('pos')">
                       <i class="bi bi-star-fill me-3" style="color:var(--gold-primary); font-size:1.2rem;"></i> 
                       <div><strong>Pós-Atendimento</strong><br><small>Cuidados e Agradecimento</small></div>
                    </button>
                    <button class="btn-action" style="background: white; border: 1px solid #EEE; color: var(--text-gray); text-align: left; box-shadow: none; display:flex; align-items:center;" onclick="enviarScript('confirmar')">
                       <i class="bi bi-clock-fill me-3" style="color:var(--gold-primary); font-size:1.2rem;"></i> 
                       <div><strong>Confirmar Horário</strong><br><small>Lembrete para amanhã</small></div>
                    </button>
                    <button class="btn-action" style="background: white; border: 1px solid #EEE; color: var(--text-gray); text-align: left; box-shadow: none; display:flex; align-items:center;" onclick="enviarScript('alergia')">
                       <i class="bi bi-shield-fill-exclamation me-3" style="color:var(--gold-primary); font-size:1.2rem;"></i> 
                       <div><strong>Alerta Alergia</strong><br><small>Cancelamento por segurança</small></div>
                    </button>
                </div>
            </div>
        </div>

    </div> <button class="fab-btn" onclick="abrirCorreio()"><i class="bi bi-heart-fill"></i></button>

    <div id="loveModal" class="modal modal-glass" tabindex="-1" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; align-items:center; justify-content:center;">
        <div class="modal-dialog">
            <div class="modal-content modal-content-glass text-center">
                <h3 style="color:var(--gold-primary); font-family:'Playfair Display'">Para Ana 💌</h3>
                <p id="loveMsg" class="mt-4 text-muted" style="font-size:1.1rem; font-style:italic; line-height:1.6;"></p>
                <button class="btn-action mt-4" style="width:auto; padding:10px 30px;" onclick="document.getElementById('loveModal').style.display='none'">Fechar</button>
            </div>
        </div>
    </div>
    
    <div id="agendaModal" class="modal modal-glass" tabindex="-1" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; align-items:center; justify-content:center;">
        <div class="modal-dialog">
            <div class="modal-content modal-content-glass">
                <h5 style="color:var(--text-dark); font-weight:700;">Dia <span id="selectedDay" style="color:var(--gold-primary)"></span></h5>
                <input type="text" id="agendaCli" class="form-input mt-4" placeholder="Nome da Cliente">
                <input type="time" id="agendaHora" class="form-input">
                <div class="d-flex gap-2 mt-2">
                    <button class="btn-action" onclick="saveEvent('russo')">Confirmar</button>
                    <button class="btn-action" style="background: white; border:1px solid var(--danger); color:var(--danger); box-shadow:none;" onclick="saveEvent('bloqueio')">Bloquear</button>
                </div>
                <button class="btn btn-link w-100 mt-3 text-muted" style="text-decoration:none; font-size:0.8rem;" onclick="document.getElementById('agendaModal').style.display='none'">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- 1. AGENDA ---
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let eventos = JSON.parse(localStorage.getItem('lash_events')) || {};
        let diaSel = null;
        const nomesMes = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            document.getElementById('mesAnoTitulo').innerText = `${nomesMes[currentMonth]} ${currentYear}`;
            grid.innerHTML = "";
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();

            for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;

            for(let d=1; d<=daysInMonth; d++) {
                const key = `${d}-${currentMonth}-${currentYear}`;
                const ev = eventos[key];
                let content = `<span>${d}</span>`;
                let cls = "day-box";
                if(d === new Date().getDate() && currentMonth === new Date().getMonth()) cls += " today";

                if(ev) {
                    if(ev.type === 'russo') content += `<div class="event-dot dot-russo"></div>`;
                    if(ev.type === 'bloqueio') content += `<div class="event-dot dot-blocked"></div>`;
                }
                grid.innerHTML += `<div class="${cls}" onclick="openAgenda('${key}', ${d})">${content}</div>`;
            }
        }
        function openAgenda(k, d) { diaSel = k; document.getElementById('selectedDay').innerText = d; document.getElementById('agendaModal').style.display='flex'; }
        function saveEvent(type) {
            const cli = document.getElementById('agendaCli').value;
            const hr = document.getElementById('agendaHora').value;
            if(type !== 'bloqueio' && !cli) return;
            eventos[diaSel] = { type, cli, hr };
            localStorage.setItem('lash_events', JSON.stringify(eventos));
            renderCalendar(); document.getElementById('agendaModal').style.display='none';
        }
        function mudarMes(d) { currentMonth+=d; if(currentMonth>11){currentMonth=0;currentYear++} if(currentMonth<0){currentMonth=11;currentYear--} renderCalendar(); }
        renderCalendar();

        // --- 2. CHAT & VISION ---
        async function enviar(){ 
            const txt = document.getElementById('msgInput').value; 
            if(!txt) return;
            document.getElementById('chatBox').innerHTML+=`<div class="bubble bubble-user">${txt}</div>`;
            document.getElementById('msgInput').value="";
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;

            try{ 
                const r = await fetch('/api/lash_chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg:txt})}); 
                const d=await r.json(); 
                document.getElementById('chatBox').innerHTML+=`<div class="bubble bubble-ai">${d.resposta}</div>`; 
                chatBox.scrollTop = chatBox.scrollHeight;
            }catch(e){
                document.getElementById('chatBox').innerHTML+=`<div class="bubble bubble-ai">Erro de conexão ✨</div>`;
            }
        }
        
        async function analisarFoto(){
             const f = document.getElementById('imageInput').files[0]; 
             if(!f) return;
             document.getElementById('loadingVision').style.display='block';
             document.getElementById('resultAnalysis').style.display='none';
             
             const fd = new FormData(); fd.append('imagem',f);
             try{ 
                 const r = await fetch('/api/lash_vision',{method:'POST',body:fd}); 
                 const d=await r.json(); 
                 document.getElementById('loadingVision').style.display='none';
                 document.getElementById('resultAnalysis').style.display='block'; 
                 document.getElementById('resultAnalysis').innerText=d.resposta.replace(/\*/g, '').replace(/#/g, ''); 
             }catch(e){
                 alert("Erro ao enviar foto");
             }
        }

        // --- 3. FINANCEIRO ---
        let fat = parseFloat(localStorage.getItem('lash_money')) || 0;
        function updateMoney() { document.getElementById('faturamentoDisplay').innerText = `R$ ${fat.toFixed(2)}`; document.getElementById('metaBar').style.width = `${(fat/2000)*100}%`; }
        function addMoney() { const v = parseFloat(document.getElementById('valorEntrada').value); if(v){ fat+=v; localStorage.setItem('lash_money', fat); updateMoney(); document.getElementById('valorEntrada').value = ''; } }
        updateMoney();

        // --- 4. ESTOQUE ---
        let stock = JSON.parse(localStorage.getItem('lash_stock')) || [{name: 'Cola Elite', qty: 1}, {name: 'Pads Gel', qty: 10}];
        function renderStock() {
            const l = document.getElementById('stockList'); l.innerHTML="";
            stock.forEach((s,i) => {
                l.innerHTML += `<div class="d-flex justify-content-between align-items-center mb-2" style="border-bottom:1px solid #EEE; padding-bottom:10px;">
                    <span style="color:var(--text-dark); font-weight:500;">${s.name}</span> 
                    <div>
                        <button class="btn btn-sm btn-light border" onclick="chgStock(${i},-1)">-</button> 
                        <span class="mx-2 text-muted" style="min-width:20px; display:inline-block; text-align:center;">${s.qty}</span> 
                        <button class="btn btn-sm btn-light border" onclick="chgStock(${i},1)">+</button>
                    </div>
                </div>`;
            });
            localStorage.setItem('lash_stock', JSON.stringify(stock));
        }
        function chgStock(i,v) { stock[i].qty+=v; if(stock[i].qty<0)stock[i].qty=0; renderStock(); }
        function addNewItem() { const n=document.getElementById('newItemName').value; if(n){stock.push({name:n,qty:5}); renderStock(); document.getElementById('newItemName').value='';} }
        function pedirReposicao() { 
            const low = stock.filter(s=>s.qty<=2);
            const msg = "Oi! Preciso repor:\n" + (low.length ? low.map(s=>s.name).join("\n") : "Tudo ok!");
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }
        renderStock();

        // --- 5. ZAP SCRIPTS ---
        function enviarScript(tipo) {
            const nome = document.getElementById('clientZapName').value || "Linda";
            const num = document.getElementById('clientZapNumber').value;
            if(!num) return alert("Coloque o número da cliente!");
            
            let msg = "";
            if(tipo === 'pos') msg = `Oii ${nome} ✨ Amei te atender! Lembre de não molhar nas primeiras 24h e higienizar sempre. Qualquer coisa me chama! 💖`;
            if(tipo === 'confirmar') msg = `Olá ${nome}! Confirmando nosso horário amanhã? 🦋`;
            if(tipo === 'alergia') msg = `Oi ${nome}, por segurança devido à alergia, infelizmente não poderemos fazer o procedimento hoje. Sua saúde em primeiro lugar! 🙏`;
            window.open(`https://wa.me/55${num}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // --- 6. FACE CHART ---
        const cv = document.getElementById('faceCanvas'); 
        const cx = cv.getContext('2d');
        cx.fillStyle="#fff"; cx.fillRect(0,0,300,300); cx.lineWidth=2; cx.lineCap='round'; cx.strokeStyle='#000';
        let paint=false;

        function loadCanvasImage(e){ 
            const r=new FileReader(); 
            r.onload=function(ev){
                const i=new Image();
                i.onload=function(){ cx.drawImage(i,0,0,300,300); };
                i.src=ev.target.result;
            }; 
            if(e.target.files[0]) r.readAsDataURL(e.target.files[0]); 
        }

        function start(e) { paint=true; cx.beginPath(); draw(e); }
        function end() { paint=false; cx.beginPath(); }
        function draw(e) {
            if(!paint) return;
            e.preventDefault();
            const r = cv.getBoundingClientRect();
            let x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
            let y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
            cx.lineTo(x, y); cx.stroke(); cx.beginPath(); cx.moveTo(x, y);
        }

        cv.addEventListener('mousedown', start); cv.addEventListener('mouseup', end); cv.addEventListener('mousemove', draw);
        cv.addEventListener('touchstart', start); cv.addEventListener('touchend', end); cv.addEventListener('touchmove', draw);
        function limparCanvas(){ cx.fillStyle="#fff"; cx.fillRect(0,0,300,300); }

        // --- 7. EXTRAS ---
        function abrirCorreio() { 
            const m = ["Você é incrível! 🦋", "Sua arte levanta autoestimas!", "Orgulho de você, chefa! ✨", "Hoje vai ser um dia de sucesso! 🚀"];
            document.getElementById('loveMsg').innerText = m[Math.floor(Math.random()*m.length)];
            document.getElementById('loveModal').style.display='flex';
        }
    </script>
</body>
</html>
